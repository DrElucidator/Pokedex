<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <span class="d-flex align-items-center gap-1">
      <img class="navbar-brand-icon" src="pokeball.png" alt="Pokéball image" />
      <a class="navbar-brand fw-medium" href="#" (click)="menuClose()">Pokédex</a>
    </span>

    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNav"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuToggle()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuOpen()" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        @for (item of navbarItems; track item.title) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="item.title === 'Home' ? item.url : null"
              [href]="item.title === 'Favorites' ? item.url : null"
              (click)="
                item.title === 'Favorites'
                  ? onNavbarItemClick(item, $event)
                  : menuClose()
              "
            >
              {{ item.title }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
