<div class="container py-5">
  <div class="row g-3">
    @for (pkm of pokeList(); track pkm.id) {
      <div class="col-md-6 col-lg-2">
        <a
          class="pokemon-card card p-3 text-center text-decoration-none"
          [style.border]="'2px solid transparent'"
          [style.background]="pkm.background"
          [routerLink]="['/pokemon', pkm.name]"
        >
          <span class="fs-6 fw-medium card-title">{{ pkm.displayName }}</span>

          <div class="d-flex justify-content-center gap-2">
            @for (type of pkm.types; track type.name) {
              <span class="badge rounded-pill text-light" [style.background-color]="type.color">{{
                type.displayName
              }}</span>
            }
          </div>

          @if (pkm.imgUrl) {
            <img [src]="pkm.imgUrl" [alt]="pkm.imgAlt" />
          } @else {
            <p>Image not found</p>
          }
        </a>
      </div>
    }
  </div>
</div>
